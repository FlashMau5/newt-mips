name: Build Nix MIPS package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - go.mod
      - go.sum

jobs:
  nix-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build flake package
        run: |
          nix develop --command bash -c "GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=0 go build -trimpath -tags='netgo,osusergo' -ldflags='-s -w' -o newt_linux_mipsle ."
          nix shell nixpkgs#upx --command upx --best --lzma newt_linux_mipsle
          
      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: newt-wsm20-binary
          path: newt_linux_mipsle
