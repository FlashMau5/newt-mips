name: Build Nix MIPS package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - go.mod
      - go.sum

permissions:
  contents: write

jobs:
  nix-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build flake package
        run: |
          mkdir -p dist
          nix develop --command bash -c "GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=0 go build -trimpath -tags='netgo,osusergo' -ldflags='-s -w' -o dist/newt ."
          nix shell nixpkgs#upx --command upx --best --lzma dist/newt

      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/newt \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "Newt mipsle softfloat"
