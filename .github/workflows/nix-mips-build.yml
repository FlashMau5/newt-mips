name: Build Nix MIPS package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - go.mod
      - go.sum

jobs:
  nix-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build flake package
        run: |
          nix develop --command bash -c "GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=0 go build -ldflags='-s -w' -o newt_linux_mipsle ."
